[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-vendor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4.0",
    "asyncpg>=0.30,<1.0",
    "redis[asyncio]>=5.0,<6.0",
    "LOLZTEAM>=1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0,<25.0",
    "alembic>=1.13,<2.0",
    "tronpy>=0.4,<1.0",
    "qrcode[pil]>=7.0,<8.0",
    "Pillow>=10.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["bot", "workers", "core"]
